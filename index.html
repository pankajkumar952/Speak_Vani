    <!-- Immediate Theme Bootstrap to prevent Flash of Wrong Theme (FOWT) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('speakvaani_theme_mode');
          var isDark = false;
          if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Manrope & Outfit -->
